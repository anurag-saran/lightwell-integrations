apiVersion: v1
kind: ServiceAccount
metadata:
  name: lightwell-artifactory
  namespace: lightwell-demo
  labels:
    app: artifactory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifactory
  namespace: lightwell-demo
  labels:
    app: artifactory
spec:
  replicas: 1
  # First boot (Derby + microservices) often exceeds the 10m default.
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: artifactory
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: artifactory
    spec:
      serviceAccountName: lightwell-artifactory
      securityContext:
        fsGroup: 1030
      # emptyDir is already group-writable via fsGroup; no root initContainer.
      containers:
        - name: artifactory
          image: releases-docker.jfrog.io/jfrog/artifactory-oss:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
            - name: router
              containerPort: 8081
          env:
            - name: JF_SHARED_DATABASE_ALLOWNONPOSTGRESQL
              value: "true"
            - name: JF_JFCONNECT_ENABLED
              value: "false"
            - name: EXTRA_JAVA_OPTIONS
              value: "-Xms512m -Xmx2g"
          securityContext:
            runAsUser: 1030
            runAsGroup: 1030
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /artifactory/api/system/ping
              port: http
            # OSS first boot routinely takes 5–10+ minutes on a single node.
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /artifactory/api/system/ping
              port: http
            initialDelaySeconds: 600
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - name: data
              mountPath: /var/opt/jfrog/artifactory
      volumes:
        # Ephemeral: this cluster's nfs-csi was not provisioning new PVCs.
        - name: data
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: artifactory
  namespace: lightwell-demo
  labels:
    app: artifactory
spec:
  selector:
    app: artifactory
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: artifactory
  namespace: lightwell-demo
  labels:
    app: artifactory
spec:
  to:
    kind: Service
    name: artifactory
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
