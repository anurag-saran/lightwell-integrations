# Demo values for gitlab/gitlab Helm chart (Community Edition).
# Usage: see scripts/setup-openshift-gitlab.sh
#
# Domain must match your OpenShift apps wildcard, e.g.
#   apps.asaran.na-launch.com  →  gitlab.apps.asaran.na-launch.com
#
# Memory: pair with scaling Nexus to 0 on the SNO (script does this by default).

global:
  edition: ce
  hosts:
    # Override via --set global.hosts.domain=... in the setup script.
    domain: apps.asaran.na-launch.com
    https: true
    gitlab:
      name: gitlab.apps.asaran.na-launch.com
  ingress:
    configureCertmanager: false
    # OpenShift Routes instead of nginx Ingress / cert-manager.
    provider: openshift
    class: none
    tls:
      enabled: false
  # Demo-only initial password; change after first login on shared clusters.
  initialRootPassword:
    key: password
    secret: lightwell-gitlab-initial-root

certmanager:
  install: false

nginx-ingress:
  enabled: false

prometheus:
  install: false

# Shared secrets / minio / registry kept minimal for demo.
gitlab-runner:
  install: true
  runners:
    config: |
      [[runners]]
        [runners.kubernetes]
          namespace = "{{.Release.Namespace}}"
          image = "ubuntu:22.04"
          helper_image = "registry.gitlab.com/gitlab-org/gitlab-runner/gitlab-runner-helper:x86_64-latest"
          privileged = false
          cpu_request = "100m"
          memory_request = "256Mi"
          memory_limit = "1Gi"

# Shrink side services for a single-node demo.
postgresql:
  primary:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

minio:
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi

gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 300m
        memory: 1.5Gi
      limits:
        memory: 2.5Gi
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
  gitaly:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
  toolbox:
    replicas: 1

registry:
  enabled: true
  hpa:
    minReplicas: 1
    maxReplicas: 1
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi
